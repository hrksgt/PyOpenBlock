[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "PyOpenBlock"
version = "0.1.0"
description = "A Python command-line uploader for CyberPi and mBot2"
readme = "README.md"
requires-python = ">=3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pyserial>=3.5,<4"]

[project.scripts]
pyopenblock = "pyopenblock.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
